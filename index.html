<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID Generator</title>

<style>
body{
    margin:0;
    font-family:system-ui;
    background:#0b0b0b;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
}
.wrapper{
    width:100%;
    max-width:760px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px 20px 120px 20px;
    box-sizing:border-box;
    position:relative;
    margin:auto;
}
.output{
    width:100%;
    max-width:580px;
    text-align:left;
    max-height:calc(100vh - 180px);
    overflow-y:auto;
    padding-bottom:10px;
    box-sizing:border-box;
}
.card{
    width:100%;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.05);
}
.line{
    margin:6px 0;
    line-height:1.5;
    font-size:18px;
    word-break:break-all;
}
.label{
    color:#6f6f6f;
}
.value{
    color:#fff;
}
.uuid{
    font-family:monospace;
    font-size:20px;
    letter-spacing:1px;
}
.loader{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -120px);
    font-family:monospace;
    font-size:11px;
    letter-spacing:4px;
    color:#7a7a7a;
    opacity:.72;
    pointer-events:none;
    text-transform:uppercase;
}
.topbar{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:16px;
    align-items:center;
    flex-wrap:wrap;
    justify-content:center;
}
button{
    background:#0b0b0b;
    border:none;
    color:#fff;
    cursor:pointer;
    font-size:14px;
}
input[type="number"]{
    width:60px;
    background:none;
    border:none;
    color:#fff;
    text-align:center;
    font-size:14px;
    outline:none;
}
.notice{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    color:#888;
    opacity:0;
    transition:.25s;
}
.copySingle{
    font-size:11px;
    color:#777;
    cursor:pointer;
    user-select:none;
}
.copySingle:hover{
    color:#fff;
}
</style>
</head>

<body>

<div class="notice" id="notice">copied</div>

<div class="wrapper">

    <div class="loader" id="loader">
        GENERATING<span style="animation:blink .9s infinite;">.</span>
    </div>

    <div class="output" id="output"></div>
</div>

<div class="topbar">
    <button onclick="generateUUIDs()">generate</button>
    <button onclick="copyAll()">copy</button>
    <button onclick="clearAll()">clear</button>

    <input id="count" type="number" value="5" min="1" max="50">
</div>

<script>

const output = document.getElementById("output");
const notice = document.getElementById("notice");
const loader = document.getElementById("loader");

let current = [];

function show(text){
    notice.textContent = text;
    notice.style.opacity = 1;
    setTimeout(()=>notice.style.opacity=0,1200);
}

function generateUUID(){
    if(window.crypto && crypto.randomUUID){
        return crypto.randomUUID();
    }
    // fallback
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
        const r = Math.random()*16|0;
        const v = c==='x'?r:(r&0x3|0x8);
        return v.toString(16);
    });
}

function copy(text){
    navigator.clipboard.writeText(text);
    show("copied");
}

function render(list){
    output.innerHTML="";

    list.forEach((id,i)=>{
        const card=document.createElement("div");
        card.className="card";

        card.innerHTML=`
        <div class="line" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <div style="flex:1;cursor:pointer;" onclick="copy('${id}')">
                <span class="label">UUID:</span>
                <span class="value uuid">${id}</span>
            </div>
            <div class="copySingle" onclick="copy('${id}')">copy</div>
        </div>
        `;
      output.appendChild(card);
    });
}

function generateUUIDs(){
    loader.style.display="block";

    setTimeout(()=>{
        const count=Math.min(50,Math.max(1,parseInt(document.getElementById("count").value)||5));

        const arr=[];
        for(let i=0;i<count;i++){
            arr.push(generateUUID());
        }

        current=arr;
        loader.style.display="none";
        render(arr);

    },300);
}

function copyAll(){
    if(!current.length) return;
    navigator.clipboard.writeText(current.join("\n"));
    show("copied");
}

function clearAll(){
    output.innerHTML="";
    current=[];
    loader.style.display="block";
}

window.onload=generateUUIDs;

</script>

</body>
</html>
